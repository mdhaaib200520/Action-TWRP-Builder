name: Recovery Builder - TWRP

on:
  workflow_dispatch:
    inputs:

      MANIFEST_BRANCH:
        description: 'TWRP Minimal-Manifest Branch'
        required: true
        default: 'twrp-12.1'
        type: choice
        options:
          - twrp-12.1
          - twrp-11

      DEVICE_TREE:
        description: 'Custom Recovery Tree'
        required: true
        default: ''

      DEVICE_TREE_BRANCH:
        description: 'Custom Recovery Tree Branch'
        required: true
        default: 'twrp-12.1'

      DEVICE_PATH:
        description: 'Specify your Device Path'
        required: true
        default: 'device/xiaomi/lake'

      DEVICE_NAME:
        description: 'Specify your Device Codename'
        required: true
        default: 'lake'

      BUILD_TARGET:
        description: 'Specify your Build Target'
        required: true
        default: 'recovery'
        type: choice
        options:
          - boot
          - recovery
          - vendorboot

      LDCHECK:
        description: 'Path of blobs to check'
        required: true
        default: 'system/bin/qseecomd'


jobs:

  build:

    name: Build TWRP by ${{ github.actor }}

    runs-on: ubuntu-22.04

    if: github.event.repository.owner.id == github.event.sender.id

    env:
      GITHUB_TOKEN: ${{ secrets.TEST }}

    permissions:
      contents: write

    steps:

      - name: Check Out
        uses: actions/checkout@v4

      - name: Display Inputs
        run: |
          echo "=============================================="
          echo "TWRP BUILD PARAMETERS"
          echo "=============================================="

          echo "Manifest Branch : ${{ inputs.MANIFEST_BRANCH }}"
          echo "Device Tree     : ${{ inputs.DEVICE_TREE }}"
          echo "Device Branch   : ${{ inputs.DEVICE_TREE_BRANCH }}"
          echo "Device Path     : ${{ inputs.DEVICE_PATH }}"
          echo "Device Name     : ${{ inputs.DEVICE_NAME }}"
          echo "Build Target    : ${{ inputs.BUILD_TARGET }}image"

          echo "=============================================="

      - name: Cleanup
        uses: rokibhasansagar/slimhub_actions@main

      - name: Set Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 24

      - name: Prepare the environment
        run: |
          sudo apt update
          sudo apt upgrade -y

          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            linux-modules-extra-$(uname -r) \
            gperf \
            gcc-multilib \
            gcc-10-multilib \
            g++-multilib \
            g++-10-multilib \
            libc6-dev \
            lib32ncurses-dev \
            x11proto-core-dev \
            libx11-dev \
            tree \
            lib32z-dev \
            libgl1-mesa-dev \
            libxml2-utils \
            xsltproc \
            bc \
            ccache \
            lib32readline-dev \
            lib32z1-dev \
            liblz4-tool \
            libncurses-dev \
            libsdl1.2-dev \
            build-essential \
            libgtk-3-dev \
            libglu1-mesa-dev \
            freeglut3-dev \
            git \
            libxml2 \
            lzop \
            pngcrush \
            schedtool \
            squashfs-tools \
            imagemagick \
            libbz2-dev \
            lzma \
            ncftp \
            qemu-user-static \
            libstdc++-10-dev \
            libncurses6 \
            python3 \
            tar \
            zip \
            unzip \
            rsync

      - name: Install OpenJDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Install Git-Repo
        run: |
          mkdir -p ~/bin

          curl -L \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o ~/bin/repo

          chmod a+x ~/bin/repo

          sudo ln -sf ~/bin/repo /usr/bin/repo

          repo --version

      - name: Check Manifest Branch
        uses: haya14busa/action-cond@v1
        id: manifest
        with:
          cond: ${{ inputs.MANIFEST_BRANCH == 'twrp-11' || inputs.MANIFEST_BRANCH == 'twrp-12.1' }}
          if_true: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git
          if_false: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git

      - name: Initialize Repo
        run: |
          mkdir -p android-recovery

          cd android-recovery

          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

          repo init \
            --depth=1 \
            -u "${{ steps.manifest.outputs.value }}" \
            -b "${{ inputs.MANIFEST_BRANCH }}"

      - name: Repo Sync
        run: |
          cd android-recovery

          repo sync \
            -j$(nproc --all) \
            --force-sync \
            --no-clone-bundle \
            --no-tags

      # ============================================================
      # FIX: system_dlkm VALIDATOR
      # ============================================================

      - name: Fix system_dlkm Validator
        run: |

          cd android-recovery

          CONFIG="build/make/core/config.mk"

          if [ ! -f "$CONFIG" ]; then
            echo "ERROR: $CONFIG does not exist!"
            exit 1
          fi

          echo "=============================================="
          echo "BEFORE PATCH"
          echo "=============================================="

          grep -n -A4 -B2 \
            "valid_super_partition_list" \
            "$CONFIG" || true

          echo ""
          echo "=============================================="
          echo "PATCHING SYSTEM_DLKM VALIDATOR"
          echo "=============================================="

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("build/make/core/config.mk")

          text = path.read_text()

          pattern = re.compile(
              r'(?m)^(\s*valid_super_partition_list\s*:=\s*)'
              r'([^\n]+)'
          )

          match = pattern.search(text)

          if not match:
              print("ERROR: valid_super_partition_list was not found.")
              raise SystemExit(1)

          prefix = match.group(1)
          current = match.group(2).strip()

          print("Current validator:")
          print(current)

          partitions = current.split()

          if "system_dlkm" not in partitions:
              partitions.append("system_dlkm")

          replacement = prefix + " ".join(partitions)

          text = (
              text[:match.start()]
              + replacement
              + text[match.end():]
          )

          path.write_text(text)

          print("")
          print("Patched validator:")
          print(" ".join(partitions))
          PY

          echo ""
          echo "=============================================="
          echo "AFTER PATCH"
          echo "=============================================="

          grep -n -A4 -B2 \
            "valid_super_partition_list" \
            "$CONFIG" || true

          echo ""
          echo "Checking system_dlkm..."

          if grep -q "valid_super_partition_list.*system_dlkm" "$CONFIG"; then
            echo "SUCCESS: system_dlkm is accepted by the validator."
          else
            echo "ERROR: system_dlkm patch was not applied."
            exit 1
          fi

      # ============================================================
      # DEVICE TREE
      # ============================================================

      - name: Clone Device Tree
        run: |

          cd android-recovery

          if [ -z "${{ inputs.DEVICE_TREE }}" ]; then
            echo "ERROR: DEVICE_TREE is empty!"
            echo ""
            echo "Enter your Xiaomi lake device tree URL."
            exit 1
          fi

          echo "=============================================="
          echo "DEVICE TREE"
          echo "=============================================="

          echo "URL:"
          echo "${{ inputs.DEVICE_TREE }}"

          echo ""
          echo "Branch:"
          echo "${{ inputs.DEVICE_TREE_BRANCH }}"

          echo ""
          echo "Path:"
          echo "${{ inputs.DEVICE_PATH }}"

          echo "=============================================="

          rm -rf "${{ inputs.DEVICE_PATH }}"

          mkdir -p "$(dirname "${{ inputs.DEVICE_PATH }}")"

          git clone \
            --depth=1 \
            -b "${{ inputs.DEVICE_TREE_BRANCH }}" \
            "${{ inputs.DEVICE_TREE }}" \
            "${{ inputs.DEVICE_PATH }}"

          cd "${{ inputs.DEVICE_PATH }}"

          echo "COMMIT_ID=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

          echo ""
          echo "Device tree commit:"
          git rev-parse HEAD

      # ============================================================
      # DEVICE TREE CHECK
      # ============================================================

      - name: Check Device Tree Configuration
        run: |

          cd android-recovery

          DEVICE="${{ inputs.DEVICE_PATH }}"

          echo "=============================================="
          echo "DEVICE TREE CHECK"
          echo "=============================================="

          if [ ! -d "$DEVICE" ]; then
            echo "ERROR: Device tree does not exist!"
            exit 1
          fi

          echo ""
          echo "Device tree:"
          echo "$DEVICE"

          echo ""
          echo "Checking product files..."

          find "$DEVICE" \
            -maxdepth 2 \
            -type f \
            \( \
              -name "AndroidProducts.mk" \
              -o -name "twrp_*.mk" \
              -o -name "omni_*.mk" \
              -o -name "BoardConfig.mk" \
            \) \
            -print

          echo ""
          echo "=============================================="
          echo "SYSTEM_DLKM REFERENCES"
          echo "=============================================="

          grep -Rni \
            --exclude-dir=.git \
            "system_dlkm" \
            "$DEVICE" \
            2>/dev/null || true

          echo ""
          echo "=============================================="
          echo "XIAOMI DYNAMIC PARTITION CONFIGURATION"
          echo "=============================================="

          grep -Rni \
            --exclude-dir=.git \
            "BOARD_XIAOMI_DYNAMIC_PARTITIONS_PARTITION_LIST" \
            "$DEVICE" \
            2>/dev/null || true

          echo ""
          echo "=============================================="
          echo "SUPER PARTITION CONFIGURATION"
          echo "=============================================="

          grep -Rni \
            --exclude-dir=.git \
            "BOARD_SUPER_PARTITION" \
            "$DEVICE" \
            2>/dev/null || true

      # ============================================================
      # MAKEFILE CHECK
      # ============================================================

      - name: Check Build Makefile
        run: |

          cd android-recovery

          echo "=============================================="
          echo "CHECKING DEVICE MAKEFILE"
          echo "=============================================="

          if [ -f "${{ inputs.DEVICE_PATH }}/twrp_${{ inputs.DEVICE_NAME }}.mk" ]; then

            echo "Found TWRP makefile:"
            echo "${{ inputs.DEVICE_PATH }}/twrp_${{ inputs.DEVICE_NAME }}.mk"

            echo "DEVICE_MAKEFILE=twrp_${{ inputs.DEVICE_NAME }}" >> "$GITHUB_ENV"

          elif [ -f "${{ inputs.DEVICE_PATH }}/omni_${{ inputs.DEVICE_NAME }}.mk" ]; then

            echo "Found Omni makefile:"
            echo "${{ inputs.DEVICE_PATH }}/omni_${{ inputs.DEVICE_NAME }}.mk"

            echo "DEVICE_MAKEFILE=omni_${{ inputs.DEVICE_NAME }}" >> "$GITHUB_ENV"

          else

            echo "ERROR: No TWRP/Omni device makefile found!"

            echo ""
            echo "Available files:"
            find "${{ inputs.DEVICE_PATH }}" \
              -maxdepth 2 \
              -type f \
              | sort

            exit 1

          fi

          echo ""
          echo "Using product:"
          echo "$DEVICE_MAKEFILE"

      # ============================================================
      # BUILD
      # ============================================================

      - name: Building Image
        run: |

          cd android-recovery

          set -e

          export ALLOW_MISSING_DEPENDENCIES=true

          echo "=============================================="
          echo "INITIALIZING BUILD ENVIRONMENT"
          echo "=============================================="

          source build/envsetup.sh

          echo ""
          echo "=============================================="
          echo "LUNCH TARGET"
          echo "=============================================="

          echo "${DEVICE_MAKEFILE}-eng"

          lunch "${DEVICE_MAKEFILE}-eng"

          echo ""
          echo "=============================================="
          echo "CLEAN BUILD"
          echo "=============================================="

          make clean

          echo ""
          echo "=============================================="
          echo "BUILDING"
          echo "=============================================="

          make "${{ inputs.BUILD_TARGET }}image" \
            -j$(nproc --all)

          echo ""
          echo "=============================================="
          echo "BUILD COMPLETED"
          echo "=============================================="

      # ============================================================
      # VERIFY OUTPUT
      # ============================================================

      - name: Verify Build Output
        run: |

          cd android-recovery

          OUTPUT_DIR="out/target/product/${{ inputs.DEVICE_NAME }}"

          echo "=============================================="
          echo "VERIFYING BUILD OUTPUT"
          echo "=============================================="

          if [ ! -d "$OUTPUT_DIR" ]; then
            echo "ERROR: Output directory does not exist!"
            exit 1
          fi

          if [ "${{ inputs.BUILD_TARGET }}" = "vendorboot" ]; then
            IMAGE="$OUTPUT_DIR/vendor_boot.img"
          else
            IMAGE="$OUTPUT_DIR/${{ inputs.BUILD_TARGET }}.img"
          fi

          if [ ! -f "$IMAGE" ]; then

            echo "ERROR: Image was not generated!"

            echo ""
            echo "Output directory:"
            ls -lah "$OUTPUT_DIR"

            exit 1

          fi

          echo ""
          echo "SUCCESS:"
          ls -lh "$IMAGE"

      # ============================================================
      # BUILD PROPERTIES
      # ============================================================

      - name: Set Build Properties
        run: |

          echo "BUILD_DATE=$(date +%Y%m%d)" >> "$GITHUB_ENV"

          echo "VENDOR=$(echo "${{ inputs.DEVICE_PATH }}" | cut -d'/' -f2)" >> "$GITHUB_ENV"

      # ============================================================
      # SAMSUNG TAR
      # ============================================================

      - name: Compressing TWRP Build (if Samsung)
        if: env.VENDOR == 'samsung'
        run: |

          cd "android-recovery/out/target/product/${{ inputs.DEVICE_NAME }}"

          if [ "${{ inputs.BUILD_TARGET }}" = "boot" ] || \
             [ "${{ inputs.BUILD_TARGET }}" = "recovery" ]; then

            tar -cvf \
              "${{ inputs.BUILD_TARGET }}.tar" \
              "${{ inputs.BUILD_TARGET }}.img"

          elif [ "${{ inputs.BUILD_TARGET }}" = "vendorboot" ]; then

            tar -cvf \
              vendor_boot.tar \
              vendor_boot.img

          fi

      # ============================================================
      # RELEASE
      # ============================================================

      - name: Upload to Release (boot and recovery)
        if: inputs.BUILD_TARGET == 'boot' || inputs.BUILD_TARGET == 'recovery'
        uses: softprops/action-gh-release@v2

        with:

          files: |
            android-recovery/out/target/product/${{ inputs.DEVICE_NAME }}/${{ inputs.BUILD_TARGET }}.*

          name: Unofficial TWRP for ${{ inputs.DEVICE_NAME }} // ${{ env.BUILD_DATE }}

          tag_name: ${{ github.run_id }}

          body: |
            TWRP Build

            Manifest:
            ${{ inputs.MANIFEST_BRANCH }}

            Device:
            ${{ inputs.DEVICE_NAME }}

            Device Tree:
            ${{ inputs.DEVICE_TREE }}

            Branch:
            ${{ inputs.DEVICE_TREE_BRANCH }}

            Commit:
            ${{ env.COMMIT_ID }}

      - name: Upload to Release (vendor_boot)
        if: inputs.BUILD_TARGET == 'vendorboot'
        uses: softprops/action-gh-release@v2

        with:

          files: |
            android-recovery/out/target/product/${{ inputs.DEVICE_NAME }}/vendor_boot.*

          name: Unofficial TWRP for ${{ inputs.DEVICE_NAME }} // ${{ env.BUILD_DATE }}

          tag_name: ${{ github.run_id }}

          body: |
            TWRP Build

            Manifest:
            ${{ inputs.MANIFEST_BRANCH }}

            Device:
            ${{ inputs.DEVICE_NAME }}

            Device Tree:
            ${{ inputs.DEVICE_TREE }}

            Branch:
            ${{ inputs.DEVICE_TREE_BRANCH }}

            Commit:
            ${{ env.COMMIT_ID }}

      # ============================================================
      # LDCHECK
      # ============================================================

      - name: Run LDCheck
        run: |

          cd android-recovery

          RECOVERY_ROOT="${GITHUB_WORKSPACE}/android-recovery/out/target/product/${{ inputs.DEVICE_NAME }}/recovery/root"

          mkdir -p "$RECOVERY_ROOT"

          if [ ! -d "tools" ]; then
            echo "tools directory not found."
            echo "Skipping LDCheck."
            exit 0
          fi

          if [ -f "tools/libneeds" ]; then
            cp -f "tools/libneeds" "$RECOVERY_ROOT/"
          fi

          if [ -f "tools/ldcheck" ]; then
            cp -f "tools/ldcheck" "$RECOVERY_ROOT/"
          fi

          if [ ! -f "$RECOVERY_ROOT/ldcheck" ]; then
            echo "ldcheck not available."
            echo "Skipping LDCheck."
            exit 0
          fi

          if [ ! -f "$RECOVERY_ROOT/libneeds" ]; then
            echo "libneeds not available."
            echo "Skipping LDCheck."
            exit 0
          fi

          cd "$RECOVERY_ROOT"

          python3 ldcheck \
            -p system/lib64:vendor/lib64:system/lib:vendor/lib \
            -d "${{ inputs.LDCHECK }}"

          echo "LDCheck completed."

        continue-on-error: true
